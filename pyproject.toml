[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memeval"
version = "0.1.0"
description = "Stage-by-stage diagnosis for long-term memory systems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dashscope>=1.14.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Start with correctness checks while the legacy scripts are moved into src/.
select = ["E9", "F63", "F7", "F82"]

[tool.setuptools.packages.find]
where = ["src"]
